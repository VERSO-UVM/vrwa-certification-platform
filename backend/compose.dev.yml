services:
  mysql:
    image: percona/percona-server:8.0
    ports:
      - 13306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=verso
      - MYSQL_DATABASE=vrwa
    volumes:
      - ${PWD}/.tmp/db-data/:/var/lib/mysql/
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pverso"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
